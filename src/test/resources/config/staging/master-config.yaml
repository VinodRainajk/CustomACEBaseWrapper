api:
  application:
    url: https://jsonplaceholder.typicode.com
    timeout: 30000
  auth:
    type: none
  paths:
    users: /users
    user_by_id: /users/1

db:
  mysql:
    type: mysql
    url: jdbc:mysql://staging-host:3306/testdb
    username: staging_user
    password: staging_pass
    driver: com.mysql.cj.jdbc.Driver
    timeout: 30000
  mysql-world:
    type: mysql
    url: jdbc:mysql://staging-host:3306/world
    username: staging_user
    password: staging_pass
    driver: com.mysql.cj.jdbc.Driver
    timeout: 30000
  postgresql:
    type: postgresql
    url: jdbc:postgresql://staging-host:5432/testdb
    username: staging_user
    password: staging_pass
    driver: org.postgresql.Driver
    timeout: 30000
  oracle:
    type: oracle
    url: jdbc:oracle:thin:@staging-host:1521:xe
    username: staging_user
    password: staging_pass
    driver: oracle.jdbc.OracleDriver
    timeout: 30000
